<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Магазин</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e85d75">
    <script>try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #fce4e8 0%, #fdf7f8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(232, 93, 117, 0.15);
            width: 100%;
            max-width: 380px;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 70px;
            height: 70px;
            background: #e85d75;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 20px auto;
            box-shadow: 0 5px 20px rgba(232, 93, 117, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .field {
            position: relative;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #f0e0e4;
            border-radius: 12px;
            background: #fdf7f8;
            transition: all 0.2s ease;
            color: #2c3e50;
        }

        input:focus {
            outline: none;
            border-color: #e85d75;
            background: white;
            box-shadow: 0 0 0 4px rgba(232, 93, 117, 0.1);
        }

        input::placeholder {
            color: #c9a8b0;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f9768b 0%, #e85d75 55%, #d14861 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            letter-spacing: 0.3px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 18px rgba(232, 93, 117, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        button:hover {
            filter: brightness(1.05);
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(232, 93, 117, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 4px 12px rgba(232, 93, 117, 0.35);
        }

        button:focus-visible {
            outline: 3px solid rgba(232, 93, 117, 0.45);
            outline-offset: 2px;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            color: #c9a8b0;
            margin-top: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin: 12px 0 6px 0;
            font-weight: 600;
        }

        button {
            padding: 17px;
            font-size: 17px;
            min-height: 54px;
        }

        input {
            padding: 15px 16px;
            font-size: 17px;
        }

        /* ===== ТЁМНАЯ ТЕМА ===== */
        html[data-theme="dark"] { color-scheme: dark; }
        html[data-theme="dark"] body { background: linear-gradient(135deg, #1a1c21 0%, #14161a 100%); }
        html[data-theme="dark"] .box { background: #1d2127; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
        html[data-theme="dark"] h1 { color: #f0f2f6; }
        html[data-theme="dark"] label { color: #a0a6ad; }
        html[data-theme="dark"] input {
            background: #14171c; color: #e6e8ec; border-color: #2b3038;
        }
        html[data-theme="dark"] input::placeholder { color: #6b727a; }
        html[data-theme="dark"] input:focus { background: #171a20; border-color: #e85d75; box-shadow: 0 0 0 4px rgba(232, 93, 117, 0.12); }
        html[data-theme="dark"] .error { color: #ff8b95; }
        html[data-theme="dark"] .footer-text { color: #6b727a; }

        /* Кнопка переключения темы на странице входа */
        .theme-float {
            position: fixed; top: 20px; right: 20px; width: 52px; height: 52px;
            border-radius: 50%; border: 2px solid #f0e0e4; background: #fff;
            font-size: 22px; cursor: pointer; box-shadow: 0 4px 15px rgba(232, 93, 117, 0.2);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; margin: 0;
        }
        .theme-float:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(232, 93, 117, 0.3); }
        html[data-theme="dark"] .theme-float { background: #1d2127; border-color: #2b3038; }
    </style>
</head>
<body>
    <button class="theme-float" id="themeSwitch" onclick="toggleTheme()" title="Переключить тему">🌙</button>
    <div class="box">
        <div class="logo">М</div>
        <h1>Вход в магазин</h1>
        <label for="username">Логин</label>
        <input type="text" id="username" placeholder="Введите логин">
        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="Введите пароль">
        <button onclick="login()">Войти</button>
        <p class="error" id="error"></p>
        <p class="footer-text">Магазин · учёт товаров, продаж и рабочих дней</p>
    </div>

    <script>
        function toggleTheme() {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            const el = document.getElementById('themeSwitch');
            if (el) el.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('error');

            if (!username || !password) {
                errorEl.textContent = 'Введите логин и пароль';
                return;
            }

            errorEl.textContent = '';

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (data.success) {
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('username', data.username);
                localStorage.setItem('fullName', data.fullName);
                localStorage.setItem('tc', data.tc || '');
                localStorage.setItem('role', data.role);
                localStorage.setItem('token', data.token);

                if (data.role === 'admin') {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/employee.html';
                }
            } else {
                errorEl.textContent = 'Неверный логин или пароль';
            }
        }

        // Вход по Enter
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('username').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
